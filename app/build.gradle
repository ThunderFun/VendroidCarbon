plugins {
    id 'com.android.application'
}

// vencord_mobile.js is generated from the numbered parts in src/main/vencord/.
// Parts are the source of truth; the two-digit prefixes make lexicographic
// sort equal to the intended concatenation order. The file tree and output
// file are resolved at configuration time for configuration-cache safety.
def vencordParts = fileTree(dir: "src/main/vencord", include: ["*.js"])
def vencordMergedFile = file("src/main/res/raw/vencord_mobile.js")

tasks.register("mergeVencordMobileJs") {
    inputs.files(vencordParts)
    outputs.file(vencordMergedFile)
    doLast {
        def out = new ByteArrayOutputStream()
        vencordParts.files.sort { it.name }.each { out.write(it.readBytes()) }
        vencordMergedFile.bytes = out.toByteArray()
    }
}
preBuild.dependsOn "mergeVencordMobileJs"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("local.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'io.github.thunderfun.vendroid'
    compileSdk 37
    compileSdkMinor = 1

    defaultConfig {
        applicationId "io.github.thunderfun.vendroid"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        buildConfig = true
        aidl = false
        renderScript = false
        resValues = false
        shaders = false
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: 'release.keystore.jks')
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: ''
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            buildConfigField "boolean", "ALLOW_WEBVIEW_DEBUGGING", "true"
            // Keep the strict CSP report-only in debug for violation triage.
            buildConfigField "boolean", "ENFORCE_STRICT_CSP", "false"
        }

        dev {
            applicationIdSuffix ".dev"
            minifyEnabled true
            shrinkResources = true
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "ALLOW_WEBVIEW_DEBUGGING", "false"
            // Enforce the strict CSP in dev to shake out breakage before release.
            buildConfigField "boolean", "ENFORCE_STRICT_CSP", "true"
        }

        release {
            minifyEnabled true
            shrinkResources = true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "ALLOW_WEBVIEW_DEBUGGING", "false"
            // Enforce the strict CSP in release once validated.
            buildConfigField "boolean", "ENFORCE_STRICT_CSP", "true"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {

    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
}

